<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MedSupply Uganda | B2B Pharma Marketplace</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <style>
    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      font: 14px system-ui, sans-serif;
      background: #eaeded;
      color: #0f1111
    }

    a {
      cursor: pointer
    }

    header {
      background: #131921;
      color: #fff;
      position: sticky;
      top: 0;
      z-index: 20
    }

    .top {
      display: flex;
      gap: 12px;
      align-items: center;
      padding: 8px 14px;
      flex-wrap: wrap
    }

    .logo {
      font-weight: 800;
      font-size: 20px;
      color: #fff
    }

    .logo span {
      color: #f68b1e;
      font-size: 12px;
      margin-left: 4px
    }

    .search {
      flex: 1;
      min-width: 220px;
      display: flex
    }

    .search input {
      flex: 1;
      border: 0;
      padding: 11px;
      border-radius: 6px 0 0 6px;
      font: inherit
    }

    .search button {
      border: 0;
      background: #f68b1e;
      padding: 0 18px;
      font-weight: 700;
      border-radius: 0 6px 6px 0;
      cursor: pointer
    }

    #acct {
      display: flex;
      gap: 12px;
      align-items: center;
      font-size: 13px
    }

    #acct a,
    .hb {
      color: #fff;
      background: none;
      border: 0;
      font: inherit;
      cursor: pointer
    }

    .hb b {
      background: #f68b1e;
      color: #111;
      border-radius: 10px;
      padding: 1px 7px;
      margin-left: 3px
    }

    main {
      max-width: 1200px;
      margin: 12px auto;
      padding: 0 10px
    }

    .card {
      background: #fff;
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: 0 1px 2px #0002
    }

    .lay {
      display: grid;
      grid-template-columns: 200px 1fr;
      gap: 12px;
      align-items: start
    }

    aside h4 {
      margin: 0 0 8px
    }

    .cat {
      display: block;
      padding: 8px;
      border-radius: 6px;
      color: #0f1111
    }

    .cat:hover {
      background: #f3f3f3
    }

    .cat.on {
      background: #fff3e6;
      color: #c45500;
      font-weight: 700
    }

    .bar {
      font-weight: 700;
      margin: 2px 0 10px
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 10px
    }

    .pc {
      background: #fff;
      border-radius: 8px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      position: relative;
      box-shadow: 0 1px 2px #0002
    }

    .im {
      height: 130px;
      border-radius: 6px;
      background: #f4f7f7;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 52px;
      overflow: hidden
    }

    .im img {
      width: 100%;
      height: 100%;
      object-fit: contain
    }

    .nm {
      font-weight: 600;
      min-height: 36px
    }

    .pr {
      font-size: 17px;
      font-weight: 800
    }

    .pr s {
      font-size: 12px;
      color: #888;
      font-weight: 400;
      margin-left: 4px
    }

    .dis {
      position: absolute;
      top: 8px;
      right: 8px;
      background: #fde8d0;
      color: #f68b1e;
      font-weight: 700;
      border-radius: 4px;
      padding: 2px 6px;
      font-size: 12px
    }

    .st {
      font-size: 12px;
      color: #0E6B63
    }

    .st.low {
      color: #c45500
    }

    .st.out {
      color: #b12704
    }

    .ob,
    .btn {
      background: #f68b1e;
      color: #111;
      border: 0;
      border-radius: 6px;
      padding: 10px;
      font-weight: 700;
      cursor: pointer;
      font: inherit;
      font-weight: 700
    }

    .ob:hover,
    .btn:hover {
      background: #e07a10
    }

    .ob:disabled,
    .btn:disabled {
      background: #ddd;
      color: #888;
      cursor: not-allowed
    }

    .btn.g {
      background: #0E6B63;
      color: #fff
    }

    .step {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: 1px solid #f68b1e;
      border-radius: 6px;
      overflow: hidden
    }

    .step button {
      background: #f68b1e;
      border: 0;
      width: 38px;
      height: 38px;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer
    }

    .step span {
      font-weight: 700
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font: inherit;
      margin: 4px 0
    }

    table {
      width: 100%;
      border-collapse: collapse
    }

    th,
    td {
      text-align: left;
      padding: 7px;
      border-bottom: 1px solid #eee;
      white-space: nowrap
    }

    td input {
      width: 95px;
      margin: 0
    }

    .two {
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 12px;
      align-items: start
    }

    .row {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      padding: 6px 0
    }

    .m {
      color: #666
    }

    .pay label {
      display: block;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 10px;
      margin: 6px 0;
      cursor: pointer
    }

    .pay input {
      width: auto;
      margin-right: 8px
    }

    .trk {
      display: flex;
      gap: 4px;
      margin: 8px 0
    }

    .trk div {
      flex: 1;
      text-align: center;
      padding: 6px;
      background: #eee;
      border-radius: 4px;
      font-size: 12px
    }

    .trk .done {
      background: #0E6B63;
      color: #fff
    }

    .trk .x {
      background: #b12704;
      color: #fff
    }

    .auth {
      max-width: 380px;
      margin: 40px auto
    }

    .link {
      color: #0E6B63;
      text-decoration: underline;
      cursor: pointer
    }

    #ov {
      position: fixed;
      inset: 0;
      background: #0006;
      display: none;
      z-index: 30
    }

    #ov.on {
      display: block
    }

    #dr {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      width: min(400px, 100%);
      background: #fff;
      z-index: 31;
      transform: translateX(100%);
      transition: .25s;
      display: flex;
      flex-direction: column;
      padding: 14px
    }

    #dr.on {
      transform: none
    }

    #dr .lines {
      flex: 1;
      overflow: auto
    }

    .gs {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 10px
    }

    .stat {
      font-size: 22px;
      font-weight: 800
    }

    #toast {
      position: fixed;
      left: 50%;
      bottom: 20px;
      transform: translateX(-50%);
      background: #0E6B63;
      color: #fff;
      padding: 12px 18px;
      border-radius: 8px;
      z-index: 50;
      display: none;
      max-width: 90%
    }

    #toast.show {
      display: block
    }

    #toast.bad {
      background: #b12704
    }

    @media(max-width:760px) {

      .lay,
      .two {
        grid-template-columns: 1fr
      }

      aside {
        display: flex;
        gap: 6px;
        overflow: auto
      }

      aside h4 {
        display: none
      }

      .cat {
        white-space: nowrap
      }

      .grid {
        grid-template-columns: repeat(2, 1fr)
      }
    }
    /* ---- v3 improvements ---- */
    .card{overflow-x:auto}
    .top{padding:10px 14px}
    .search input{padding:14px 16px;font-size:16px}
    .search button{padding:0 22px}
    .hb{border:1px solid #ffffff44;border-radius:8px;padding:9px 13px}
    .hb:hover{background:#ffffff14}
    .lay aside.card{position:sticky;top:84px}
    .cat small{float:right}
    .tools{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:2px 0 10px}
    .tools .bar{margin:0;flex:1}
    .tools select{width:auto;margin:0}
    .tools label{display:flex;align-items:center;gap:6px;cursor:pointer}
    .tools label input{width:auto;margin:0}
    .sk{height:260px;border-radius:8px;background:linear-gradient(90deg,#fff 25%,#f0f2f2 50%,#fff 75%);background-size:200% 100%;animation:sh 1.2s infinite}
    @keyframes sh{to{background-position:-200% 0}}
    .th{display:inline-flex;width:34px;height:34px;border-radius:6px;background:#f4f7f7;align-items:center;justify-content:center;margin-right:8px;vertical-align:middle;overflow:hidden}
    .th img{width:100%;height:100%;object-fit:contain}
    .warn{color:#b12704}
    .bad{color:#b12704}
    .lowrow{background:#fff6ec}
    .pay label:has(input:disabled){opacity:.55;cursor:not-allowed}
    button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #f68b1e;outline-offset:2px}
    @media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
  </style>
</head>

<body>
  <header>
    <div class="top"><a class="logo" data-go="shop">💊 MedSupply<span>Uganda</span></a>
      <div class="search"><input id="q" placeholder="Search medicines, brands and categories  ( press / )" aria-label="Search products"><button
          id="sb">SEARCH</button></div>
      <div id="acct"></div><button class="hb" id="cb" aria-label="Open cart">🛒 Cart<b id="cc">0</b></button>
    </div>
  </header>
  <main id="app"></main>
  <div id="ov"></div>
  <aside id="dr"></aside>
  <div id="toast"></div>
  <script>
    // ===== CONFIG: paste the SAME two values you used before (Supabase > Project Settings > API) =====
    const SUPABASE_URL = "https://dcpvdapxzkaahyhpflul.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_SiQMwIgDgLmckNQHUmO3SA_78UQBLHf";
    // ================================================================================================
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const $ = s => document.querySelector(s);
    const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const ugx = n => "UGX " + Math.round(+n || 0).toLocaleString();
    const ICON = { Antimalarial: "🦟", Antibiotic: "💊", Rehydration: "💧", Analgesic: "🤕" };
    let srt = "name", stockOnly = false;
    const soon = d => d && new Date(d) - Date.now() < 90 * 864e5 && new Date(d) > Date.now() ? ' <b class="warn">⚠ Expires soon</b>' : "";
    const expired = d => d && new Date(d) < Date.now();
    const pct = p => p.old_price > p.price ? 1 - p.price / p.old_price : 0;
    const sortList = l => srt === "pa" ? l.sort((a, b) => a.price - b.price) : srt === "pd" ? l.sort((a, b) => b.price - a.price) : srt === "off" ? l.sort((a, b) => pct(b) - pct(a)) : l;
    function clampCart() { if (!products.length) return; let ch = false; for (const [id, q] of Object.entries(cart)) { const p = products.find(x => x.id === id); if (!p || p.stock <= 0 || expired(p.expiry)) { delete cart[id]; ch = true; } else if (q > p.stock) { cart[id] = p.stock; ch = true; } } if (ch) { persist(); toast("Your cart was updated to match available stock", 1); } }
    let me = null, profile = null, products = [], view = "shop", cat = "All", signup = false, myOrders = [];
    let cart = (() => { try { return JSON.parse(localStorage.getItem("ms_cart")) || {}; } catch { return {}; } })();
    const count = () => Object.values(cart).reduce((a, b) => a + b, 0);
    const lines = () => Object.entries(cart).map(([id, q]) => ({ p: products.find(x => x.id === id), q })).filter(l => l.p);
    const total = () => lines().reduce((s, l) => s + l.p.price * l.q, 0);
    function toast(m, bad) { const t = $("#toast"); t.textContent = m; t.className = "show" + (bad ? " bad" : ""); clearTimeout(toast.t); toast.t = setTimeout(() => t.className = "", 6000); }
    function persist() { try { localStorage.setItem("ms_cart", JSON.stringify(cart)); } catch { } $("#cc").textContent = count(); }

    // ---------- session ----------
    sb.auth.onAuthStateChange((_e, s) => { const u = s?.user || null; if (u?.id !== me?.id) { me = u; setTimeout(loadAll, 0); } });
    sb.auth.getSession().then(({ data }) => { me = data.session?.user || null; loadAll(); });
    async function loadAll() {
      profile = null;
      if (me) { const r = await sb.from("profiles").select("*").eq("id", me.id).maybeSingle(); profile = r.data; }
      products = []; head(); persist(); go(me ? (view === "auth" ? "shop" : view) : "auth");
    }
    function head() {
      $("#acct").innerHTML = me ? `<span>Hi, ${esc((profile?.business_name || me.email).split(" ")[0])}</span><a data-go="orders">My orders</a>${profile?.role === "admin" ? `<a data-go="admin">Admin</a>` : ""}<a id="out">Sign out</a>` : "";
      $("#cb").style.display = me ? "" : "none";
    }
    function go(v) { view = v; closeDrawer(); ({ auth: vAuth, shop: vShop, checkout: vCheckout, orders: vOrders, admin: vAdmin })[v](); scrollTo(0, 0); }

    document.addEventListener("click", async e => {
      const t = e.target.closest("[data-go],[data-act],[data-cat],#out,#cb,#ov,#sb"); if (!t) return;
      if (t.dataset.go) return go(t.dataset.go);
      if (t.id === "out") { await sb.auth.signOut(); cart = {}; persist(); return; }
      if (t.id === "cb") return openDrawer();
      if (t.id === "ov") return closeDrawer();
      if (t.id === "sb") return go("shop");
      if (t.dataset.cat) { cat = t.dataset.cat; return drawShop(); }
      const id = t.dataset.id, p = products.find(x => x.id === id), q = cart[id] || 0;
      if (t.dataset.act === "inc") { if (q >= p.stock) return toast(`Only ${p.stock} available`, 1); cart[id] = q + 1; }
      if (t.dataset.act === "dec") { q <= 1 ? delete cart[id] : cart[id] = q - 1; }
      if (t.dataset.act === "del") delete cart[id];
      if (t.dataset.act === "reorder") { const o = myOrders.find(x => x.id == t.dataset.oid); o.items.forEach(i => { const pp = products.find(x => x.id === i.id); if (pp && pp.stock > 0) cart[i.id] = Math.min(i.qty, pp.stock); }); persist(); go("shop"); return openDrawer(); }
      refresh();
    });
    let qt; $("#q").addEventListener("input", () => { clearTimeout(qt); qt = setTimeout(() => { if (view !== "shop") go("shop"); else drawShop(); }, 150); });
    document.addEventListener("keydown", e => { if (e.key === "Escape") closeDrawer(); if (e.key === "/" && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName) && me) { e.preventDefault(); $("#q").focus(); } });
    function refresh() { persist(); const y = scrollY; if (view === "shop") drawShop(); if (view === "checkout") sumDraw(); drawDrawer(); scrollTo(0, y); }

    // ---------- auth ----------
    function vAuth() {
      $("#app").innerHTML = `<div class="card auth"><h2>${signup ? "Register your shop" : "Sign in"}</h2>
  ${signup ? `<input id="bn" placeholder="Business name"><input id="ph" placeholder="Phone (2567...)">` : ""}
  <input id="em" type="email" placeholder="Email"><input id="pw" type="password" placeholder="Password (min 8 chars)">
  <button class="ob" id="go" style="width:100%;margin-top:8px">${signup ? "Create account" : "Sign in"}</button>
  <p class="m"><span class="link" id="sw">${signup ? "Have an account? Sign in" : "New shop? Register"}</span>${signup ? "" : ` · <span class="link" id="fp">Forgot password</span>`}</p></div>`;
      $("#sw").onclick = () => { signup = !signup; vAuth(); };
      if ($("#fp")) $("#fp").onclick = async () => { const e = $("#em").value; if (!e) return toast("Enter your email first", 1); const { error } = await sb.auth.resetPasswordForEmail(e, { redirectTo: location.origin }); toast(error ? error.message : "Reset link sent", !!error); };
      $("#go").onclick = async () => {
        const email = $("#em").value.trim(), password = $("#pw").value;
        const r = signup ? await sb.auth.signUp({ email, password, options: { data: { business_name: $("#bn").value, phone: $("#ph").value } } }) : await sb.auth.signInWithPassword({ email, password });
        if (r.error) return toast(r.error.message, 1);
        if (signup && !r.data.session) toast("Account created. Check your email to confirm, then sign in.");
      };
    }

    // ---------- shop ----------
    async function vShop() {
      if (!products.length) $("#app").innerHTML = `<div class="grid">${"<div class=sk></div>".repeat(8)}</div>`;
      if (!products.length) { const r = await sb.from("products").select("*").order("name"); if (r.error) return toast(r.error.message, 1); products = r.data || []; }
      clampCart(); drawShop(); drawDrawer();
    }
    const ctl = p => {
      const q = cart[p.id] || 0; if (p.stock <= 0) return `<button class="ob" disabled>Out of stock</button>`;
      if (expired(p.expiry)) return `<button class="ob" disabled>Expired</button>`;
      return q ? `<div class="step"><button data-act="dec" data-id="${p.id}">−</button><span>${q}</span><button data-act="inc" data-id="${p.id}">+</button></div>` : `<button class="ob" data-act="inc" data-id="${p.id}">🛒 Add to cart</button>`;
    };
    const card = p => {
      const off = p.old_price > p.price ? Math.round(100 - p.price / p.old_price * 100) : 0;
      return `<div class="pc">${off ? `<span class="dis">-${off}%</span>` : ""}<div class="im">${p.image_url ? `<img src="${esc(p.image_url)}" alt="" loading="lazy">` : ICON[p.category] || "💊"}</div>
  <div class="nm">${esc(p.name)}</div><div class="pr">${ugx(p.price)}${off ? `<s>${ugx(p.old_price)}</s>` : ""}</div>
  <div class="st ${p.stock <= 0 ? "out" : p.stock <= p.reorder_level ? "low" : ""}">${p.stock <= 0 ? "Out of stock" : p.stock <= p.reorder_level ? `Only ${p.stock} left` : "In stock"}${p.expiry ? " · Exp " + esc(p.expiry) : ""}${soon(p.expiry)}</div>${ctl(p)}</div>`;
    };
    function drawShop() {
      if (view !== "shop") return;
      const cats = ["All", ...new Set(products.map(p => p.category).filter(Boolean))], f = $("#q").value.trim().toLowerCase();
      let list = products.filter(p => (cat === "All" || p.category === cat) && (!stockOnly || p.stock > 0) && (!f || (p.name + " " + (p.category || "")).toLowerCase().includes(f)));
      list = sortList(list);
      $("#app").innerHTML = `<div class="lay"><aside class="card"><h4>Categories</h4>${cats.map(c => `<a class="cat ${c === cat ? "on" : ""}" data-cat="${esc(c)}">${esc(c)} <small class="m">${c === "All" ? products.length : products.filter(p => p.category === c).length}</small></a>`).join("")}</aside>
  <section><div class="tools"><div class="bar">${list.length} product${list.length === 1 ? "" : "s"}</div><label><input type="checkbox" ${stockOnly ? "checked" : ""} onchange="stockOnly=this.checked;drawShop()">In stock only</label><select aria-label="Sort products" onchange="srt=this.value;drawShop()">${[["name", "Name A–Z"], ["pa", "Price: low to high"], ["pd", "Price: high to low"], ["off", "Biggest discount"]].map(o => `<option value="${o[0]}" ${o[0] === srt ? "selected" : ""}>${o[1]}</option>`).join("")}</select></div><div class="grid">${list.map(card).join("") || `<p class="m">No products found.</p>`}</div></section></div>`;
    }

    // ---------- cart drawer ----------
    function openDrawer() { drawDrawer(); $("#dr").classList.add("on"); $("#ov").classList.add("on"); }
    function closeDrawer() { $("#dr").classList.remove("on"); $("#ov").classList.remove("on"); }
    function drawDrawer() {
      const L = lines();
      $("#dr").innerHTML = `<div class="row"><h3 style="margin:0">Cart (${count()})</h3><a data-act="x" onclick="closeDrawer()" aria-label="Close cart">✕</a></div><div class="lines">${L.map(l => `<div class="card"><div class="nm"><span class="th">${l.p.image_url ? `<img src="${esc(l.p.image_url)}" alt="">` : ICON[l.p.category] || "💊"}</span>${esc(l.p.name)}</div><div class="m">${ugx(l.p.price)} each</div>
  <div class="row"><b>${ugx(l.p.price * l.q)}</b><div class="step" style="width:120px"><button data-act="dec" data-id="${l.p.id}">−</button><span>${l.q}</span><button data-act="inc" data-id="${l.p.id}">+</button></div></div>
  <a class="link" data-act="del" data-id="${l.p.id}">Remove</a></div>`).join("") || `<p class="m">Your cart is empty.</p>`}</div>
  ${L.length ? `<a class="link" onclick="if(confirm('Clear your cart?')){cart={};refresh()}">Clear cart</a>` : ""}<div class="row"><b>Subtotal</b><b>${ugx(total())}</b></div><button class="ob" ${L.length ? "" : "disabled"} data-go="checkout">Checkout</button>`;
    }

    // ---------- checkout ----------
    function vCheckout() {
      if (!lines().length) { toast("Your cart is empty", 1); return go("shop"); }
      $("#app").innerHTML = `<div class="two"><div><div class="card"><h3>1. Delivery details</h3><input id="rn" placeholder="Recipient / shop name" value="${esc(profile?.business_name)}">
  <input id="rp" placeholder="Phone (2567...)" value="${esc(profile?.phone)}"><input id="ra" placeholder="Delivery address / district" value="${esc(profile?.address)}"><textarea id="nt" placeholder="Notes (optional)"></textarea></div>
  <div class="card pay"><h3>2. Payment method</h3><label><input type="radio" name="pm" value="Mobile Money" checked>📱 Mobile Money (MTN / Airtel)</label>
  <label><input type="radio" name="pm" value="Cash on Delivery">💵 Cash on Delivery</label><label><input type="radio" name="pm" value="Trade Credit" ${total() > (profile?.credit_limit || 0) ? "disabled" : ""}>🧾 7-day Trade Credit <span class="m">(limit: ${ugx(profile?.credit_limit)})</span>${total() > (profile?.credit_limit || 0) ? ` <span class="bad">· this order is above your limit</span>` : ""}</label></div></div>
  <div class="card" id="sum"></div></div>`;
      sumDraw();
    }
    function sumDraw() {
      const s = $("#sum"); if (!s) return;
      s.innerHTML = `<h3>Order summary</h3>${lines().map(l => `<div class="row"><span>${esc(l.p.name)} × ${l.q}</span><span>${ugx(l.p.price * l.q)}</span></div>`).join("")}
  <div class="row"><b>Total</b><b class="stat">${ugx(total())}</b></div><button class="ob" id="place" style="width:100%">Place order</button><p><a class="link" onclick="openDrawer()">Edit cart</a></p>`;
      $("#place").onclick = place;
    }
    async function place() {
      const btn = $("#place"), name = $("#rn").value.trim(), phone = $("#rp").value.trim(), addr = $("#ra").value.trim();
      if (!name || !phone || !addr) return toast("Please fill in name, phone and delivery address", 1);
      if (!/^(\+?256|0)\d{9}$/.test(phone.replace(/[\s-]/g, ""))) return toast("Enter a valid Ugandan phone number, e.g. 256772123456", 1);
      btn.disabled = true; btn.textContent = "Placing order...";
      const items = Object.entries(cart).map(([id, qty]) => ({ id, qty }));
      const { data, error } = await sb.rpc("place_order", { p_items: items, p_name: name, p_phone: phone, p_address: addr, p_method: document.querySelector("input[name=pm]:checked").value, p_notes: $("#nt").value });
      if (error) { btn.disabled = false; btn.textContent = "Place order"; console.error(error); return toast("Order failed: " + error.message, 1); }
      await sb.from("profiles").update({ business_name: profile?.business_name || name, phone, address: addr }).eq("id", me.id);
      cart = {}; persist(); products = []; go("orders"); toast(`✅ Order #${data} placed!`);
    }

    // ---------- orders ----------
    async function vOrders() {
      if (!products.length) { const r = await sb.from("products").select("*"); products = r.data || []; }
      const { data, error } = await sb.from("orders").select("*").order("created_at", { ascending: false }); if (error) toast(error.message, 1);
      myOrders = data || []; const S = ["Processing", "Dispatched", "Delivered"];
      $("#app").innerHTML = `<h2>My orders</h2>` + (myOrders.map(o => {
        const i = S.indexOf(o.status);
        return `<div class="card"><div class="row"><b>Order #${o.id}</b><span class="m">${new Date(o.created_at).toLocaleString()}</span></div>
    <div class="trk">${o.status === "Cancelled" ? `<div class="x">Cancelled</div>` : S.map((s, k) => `<div class="${i >= k ? "done" : ""}">${s}</div>`).join("")}</div>
    ${o.items.map(x => `<div class="row"><span>${esc(x.name)} × ${x.qty}</span><span>${ugx(x.price * x.qty)}</span></div>`).join("")}
    <div class="row"><span class="m">${esc(o.payment_method)} · ${esc(o.payment_status)}</span><b>${ugx(o.total)}</b></div><button class="btn g" data-act="reorder" data-oid="${o.id}">Reorder</button></div>`;
      }).join("") || `<div class="card m">No orders yet. <a class="link" data-go="shop">Start shopping</a></div>`);
    }

    // ---------- admin ----------
    async function vAdmin() {
      const [o, p] = await Promise.all([sb.from("orders").select("*").order("created_at", { ascending: false }), sb.from("products").select("*").order("id")]);
      const orders = o.data || [], prods = p.data || [], rev = orders.filter(x => x.status !== "Cancelled").reduce((s, x) => s + +x.total, 0);
      const S = ["Processing", "Dispatched", "Delivered", "Cancelled"], P = ["Pending Payment", "Paid", "On Credit", "Pay on Delivery"];
      const opt = (a, v) => a.map(x => `<option ${x === v ? "selected" : ""}>${x}</option>`).join("");
      const inp = (x, f, t = "number") => `<input type="${t}" value="${esc(x[f] ?? "")}" data-p="${esc(x.id)}" data-f="${f}">`;
      $("#app").innerHTML = `<div class="gs"><div class="card">Orders<div class="stat">${orders.length}</div></div><div class="card">Revenue<div class="stat">${ugx(rev)}</div></div><div class="card">Low stock<div class="stat">${prods.filter(x => x.stock <= x.reorder_level).length}</div></div></div>
  <div class="card"><div class="row"><h3 style="margin:0">Orders</h3><button class="btn g" id="csv">Export CSV</button></div><table><thead><tr><th>#</th><th>Customer</th><th>Phone</th><th>Address</th><th>Items</th><th>Total</th><th>Payment</th><th>Status</th></tr></thead><tbody>${orders.map(r =>
        `<tr><td>${r.id}</td><td>${esc(r.recipient_name)}</td><td>${esc(r.phone)}</td><td>${esc(r.address)}</td><td>${r.items.map(i => esc(i.name) + " ×" + i.qty).join(", ")}</td><td>${ugx(r.total)}</td>
  <td><select data-o="${r.id}" data-f="payment_status">${opt(P, r.payment_status)}</select></td><td><select data-o="${r.id}" data-f="status">${opt(S, r.status)}</select></td></tr>`).join("")}</tbody></table></div>
  <div class="card"><h3>Inventory</h3><table><thead><tr><th>ID</th><th>Name</th><th>Price</th><th>Old price</th><th>Stock</th><th>Reorder</th><th>Category</th><th>Image URL</th><th></th></tr></thead><tbody>${prods.map(x =>
          `<tr class="${x.stock <= x.reorder_level ? "lowrow" : ""}"><td>${esc(x.id)}</td><td>${esc(x.name)}</td><td>${inp(x, "price")}</td><td>${inp(x, "old_price")}</td><td>${inp(x, "stock")}</td><td>${inp(x, "reorder_level")}</td><td>${inp(x, "category", "text")}</td><td>${inp(x, "image_url", "text")}</td><td><button class="btn" data-save="${esc(x.id)}">Save</button></td></tr>`).join("")}</tbody></table></div>
  <div class="card"><h3>Add product</h3><div class="gs"><input id="nid" placeholder="ID e.g. INV-009"><input id="nn" placeholder="Name"><input id="nc" list="cl" placeholder="Category"><datalist id="cl">${[...new Set(prods.map(x => x.category).filter(Boolean))].map(c => `<option value="${esc(c)}">`).join("")}</datalist><input id="npr" type="number" placeholder="Price"><input id="nst" type="number" placeholder="Stock"><input id="nex" type="date"><input id="nim" placeholder="Image URL (optional)"></div><button class="btn" id="add">Add product</button></div>`;
      document.querySelectorAll("[data-o]").forEach(s => s.onchange = async () => { const { error } = await sb.from("orders").update({ [s.dataset.f]: s.value }).eq("id", s.dataset.o); toast(error ? error.message : "Order updated", !!error); });
      document.querySelectorAll("[data-save]").forEach(b => b.onclick = async () => {
        const id = b.dataset.save, v = {}; document.querySelectorAll(`[data-p="${id}"]`).forEach(i => v[i.dataset.f] = i.type === "number" ? (i.value === "" ? null : +i.value) : (i.value || null));
        const { error } = await sb.from("products").update(v).eq("id", id); products = []; toast(error ? error.message : "Saved", !!error);
      });
      $("#csv").onclick = () => { const q = v => `"${String(v ?? "").replace(/"/g, '""')}"`; const rows = [["Order", "Date", "Customer", "Phone", "Address", "Items", "Total", "Payment", "Payment status", "Status"], ...orders.map(r => [r.id, r.created_at, r.recipient_name, r.phone, r.address, r.items.map(i => i.name + " x" + i.qty).join("; "), r.total, r.payment_method, r.payment_status, r.status])]; const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([rows.map(r => r.map(q).join(",")).join("\n")], { type: "text/csv" })); a.download = "medsupply-orders.csv"; a.click(); };
      $("#add").onclick = async () => {
        const { error } = await sb.from("products").insert({ id: $("#nid").value.trim(), name: $("#nn").value.trim(), category: $("#nc").value.trim(), price: +$("#npr").value, stock: +$("#nst").value, expiry: $("#nex").value || null, image_url: $("#nim").value.trim() || null });
        if (error) return toast(error.message, 1); products = []; vAdmin();
      };
    }
  </script>
</body>

</html>
